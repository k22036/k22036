name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@8614f3a61601854731381d853f8566867754a5ca # v2.0.0
        with:
          card: stats
          options: username=${{ github.repository_owner }}&theme=vue-dark&layout=compact
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@8614f3a61601854731381d853f8566867754a5ca # v2.0.0
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&theme=vue-dark&layout=compact&card_width=400
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg
          git commit -m "Update README cards" || exit 0

          # use GITHUB_TOKEN for a short-lived authenticated push without persisting credentials
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"
          git push origin HEAD:refs/heads/${REF_NAME}
